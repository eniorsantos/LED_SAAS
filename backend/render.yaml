services:
  - type: web
    name: saas-leds-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: DB_PATH
        value: /data/data.db
      - key: SEED
        value: "false"
      - key: HOJE
        value: ""
      - key: DATABASE_URL
        description: "Opcional: connection string do Supabase/PostgreSQL. Se definido, usa PostgreSQL em vez de SQLite."
        required: false
    disk:
      name: led-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
